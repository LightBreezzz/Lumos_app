{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" href="{% static 'img/4icon.png' %}"> -->
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap @5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block scripts %}
    <script src="{% static 'node_modules/chart.js/dist/chart.umd.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="{% static 'scripts/today.js' %}"></script>
    <script src="{% static 'scripts/open.js' %}"></script> 
    {% endblock %}
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
   <aside class="sidebar">
        <!-- Основное меню -->
        {% include 'menu.html' %}

        <!-- Настройки (внизу слева) -->
        {% include 'settings.html' %}
    </aside>
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
