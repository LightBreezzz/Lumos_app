{% extends 'base.html' %}
{% block title %}{% if is_edit %}Редактировать цель{% else %}Создать цель{% endif %}{% endblock %}
{% block content %}
<div class="goal-form-page">
    <h2>{% if is_edit %}Редактировать цель{% else %}Создать цель{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'goals_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
